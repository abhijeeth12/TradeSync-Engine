# TradeSync Engine Configuration

# Database
db.url=jdbc:postgresql://localhost:5432/tradesync
db.username=tradesync
db.password=tradesync_secret
db.pool.size=20

# API Server
api.port=7070
api.key=tradesync-secret-key-2024

# Ingestion
ingestion.producers=4
ingestion.consumers=8
ingestion.queue.capacity=50000

# Reconciliation
reconciliation.interval.seconds=30

# Benchmark defaults
benchmark.threads=20
benchmark.trades.per.thread=500
